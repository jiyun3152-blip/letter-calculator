<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자 수 계산기</title>
    <style>
        @font-face {
            font-family: 'NostalgicMyoeunHeullim';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-1@1.0/Griun_MyoeunHeullim-Rg.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        body {
            font-family: 'NostalgicMyoeunHeullim', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #000;
        }
        .settings {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label {
            font-weight: 500;
            color: #000;
        }
        input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 120px;
            font-family: 'NostalgicMyoeunHeullim', inherit;
            color: #000;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'NostalgicMyoeunHeullim', inherit;
            resize: vertical;
            min-height: 200px;
            box-sizing: border-box;
            background-color: #fffacd;
            color: #000;
        }
        .stats {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f4f8;
            border-radius: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 12px;
            color: #000;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #000;
        }
        .stat-value.warning {
            color: #ff6b6b;
        }
        .stat-value.success {
            color: #51cf66;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #ddd;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #51cf66;
            transition: background-color 0.3s;
            width: 0%;
        }
        .progress-fill.warning {
            background-color: #ffa94d;
        }
        .progress-fill.danger {
            background-color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>글자 수 계산기</h1>
        
        <div class="settings">
            <div class="setting-item">
                <label for="maxChars">최대 글자 수:</label>
                <input type="number" id="maxChars" value="1000" min="1">
            </div>
            <div class="setting-item">
                <input type="checkbox" id="excludeSpaces">
                <label for="excludeSpaces">공백 미포함 체크</label>
            </div>
        </div>

        <textarea id="textArea" placeholder="여기에 텍스트를 입력하세요..."></textarea>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">공백 포함</div>
                <div class="stat-value" id="withSpaces">0</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressWithSpaces" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-label">공백 미포함</div>
                <div class="stat-value" id="withoutSpaces">0</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressWithoutSpaces" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const textArea = document.getElementById('textArea');
        const maxCharsInput = document.getElementById('maxChars');
        const excludeSpacesCheckbox = document.getElementById('excludeSpaces');
        const withSpacesDisplay = document.getElementById('withSpaces');
        const withoutSpacesDisplay = document.getElementById('withoutSpaces');
        const progressWithSpaces = document.getElementById('progressWithSpaces');
        const progressWithoutSpaces = document.getElementById('progressWithoutSpaces');

        function updateCount() {
            const text = textArea.value;
            const withSpaces = text.length;
            const withoutSpaces = text.replace(/\s/g, '').length;
            const maxChars = parseInt(maxCharsInput.value) || 1000;

            // 공백 포함 업데이트
            withSpacesDisplay.textContent = withSpaces;
            const percentWithSpaces = (withSpaces / maxChars) * 100;
            progressWithSpaces.style.width = Math.min(percentWithSpaces, 100) + '%';
            
            if (withSpaces > maxChars) {
                withSpacesDisplay.classList.add('warning');
                progressWithSpaces.classList.add('danger');
            } else {
                withSpacesDisplay.classList.remove('warning');
                progressWithSpaces.classList.remove('danger');
                if (percentWithSpaces > 80) {
                    progressWithSpaces.classList.add('warning');
                } else {
                    progressWithSpaces.classList.remove('warning');
                }
            }

            // 공백 미포함 업데이트
            withoutSpacesDisplay.textContent = withoutSpaces;
            const percentWithoutSpaces = (withoutSpaces / maxChars) * 100;
            progressWithoutSpaces.style.width = Math.min(percentWithoutSpaces, 100) + '%';
            
            if (withoutSpaces > maxChars) {
                withoutSpacesDisplay.classList.add('warning');
                progressWithoutSpaces.classList.add('danger');
            } else {
                withoutSpacesDisplay.classList.remove('warning');
                progressWithoutSpaces.classList.remove('danger');
                if (percentWithoutSpaces > 80) {
                    progressWithoutSpaces.classList.add('warning');
                } else {
                    progressWithoutSpaces.classList.remove('warning');
                }
            }
        }

        textArea.addEventListener('input', updateCount);
        maxCharsInput.addEventListener('change', updateCount);
        excludeSpacesCheckbox.addEventListener('change', updateCount);

        // 초기 업데이트
        updateCount();
    </script>
</body>
</html>
