<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자 수 계산기</title>
    <style>
        @font-face {
            font-family: 'NostalgicMyoeunHeullim';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-1@1.0/Griun_MyoeunHeullim-Rg.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        body {
            font-family: 'NostalgicMyoeunHeullim', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .settings {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label {
            font-weight: 500;
            color: #000;
        }
        input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 120px;
            font-family: 'NostalgicMyoeunHeullim', inherit;
            color: #000;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'NostalgicMyoeunHeullim', inherit;
            resize: vertical;
            min-height: 200px;
            box-sizing: border-box;
            background-color: #fffacd;
            color: #000;
            transition: border-color 0.3s;
        }
        textarea.exceeded {
            border-color: #ff6b6b;
            background-color: #ffe6e6;
        }
        .warning-message {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background-color: #ffe6e6;
            border: 1px solid #ff6b6b;
            border-radius: 4px;
            color: #ff6b6b;
            font-weight: bold;
        }
        .warning-message.show {
            display: block;
        }
        .stats {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f4f8;
            border-radius: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 12px;
            color: #000;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #000;
        }
        .stat-value.warning {
            color: #ff6b6b;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #ddd;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #51cf66;
            transition: background-color 0.3s;
            width: 0%;
        }
        .progress-fill.warning {
            background-color: #ffa94d;
        }
        .progress-fill.danger {
            background-color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="settings">
            <div class="setting-item">
                <label for="maxChars">최대 글자 수:</label>
                <input type="number" id="maxChars" value="1000" min="1">
            </div>
        </div>

        <textarea id="textArea" placeholder="여기에 텍스트를 입력하세요..."></textarea>
        
        <div class="warning-message" id="warningMessage">
            ⚠️ 최대 글자 수를 초과했습니다. 더 이상 입력할 수 없습니다.
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">글자 수</div>
                <div class="stat-value" id="charCount">0</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-label">남은 글자 수</div>
                <div class="stat-value" id="remainingChars">1000</div>
            </div>
        </div>
    </div>

    <script>
        const textArea = document.getElementById('textArea');
        const maxCharsInput = document.getElementById('maxChars');
        const charCountDisplay = document.getElementById('charCount');
        const remainingCharsDisplay = document.getElementById('remainingChars');
        const progressBar = document.getElementById('progressBar');
        const warningMessage = document.getElementById('warningMessage');

        function updateCount() {
            const text = textArea.value;
            const maxChars = parseInt(maxCharsInput.value) || 1000;
            const charCount = text.length;
            const remainingChars = maxChars - charCount;

            // 글자 수 표시
            charCountDisplay.textContent = charCount;
            remainingCharsDisplay.textContent = Math.max(remainingChars, 0);

            // 진행률 바 업데이트
            const percent = Math.min((charCount / maxChars) * 100, 100);
            progressBar.style.width = percent + '%';

            // 색상 변경
            if (charCount > maxChars) {
                charCountDisplay.classList.add('warning');
                progressBar.classList.add('danger');
                textArea.classList.add('exceeded');
                warningMessage.classList.add('show');
            } else {
                charCountDisplay.classList.remove('warning');
                textArea.classList.remove('exceeded');
                warningMessage.classList.remove('show');
                if (percent > 80) {
                    progressBar.classList.add('warning');
                } else {
                    progressBar.classList.remove('warning', 'danger');
                }
            }
        }

        // 입력 제한
        textArea.addEventListener('input', function(e) {
            const maxChars = parseInt(maxCharsInput.value) || 1000;
            
            if (this.value.length > maxChars) {
                this.value = this.value.substring(0, maxChars);
            }
            
            updateCount();
        });

        maxCharsInput.addEventListener('change', updateCount);

        // 초기 업데이트
        updateCount();
    </script>
</body>
</html>
