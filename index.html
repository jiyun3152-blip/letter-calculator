<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자 수 계산기</title>
    <style>
        @font-face {
            font-family: 'NostalgicMyoeunHeullim';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-1@1.0/Griun_MyoeunHeullim-Rg.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }

        body {
            font-family: 'NostalgicMyoeunHeullim', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .settings {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label {
            font-weight: 500;
            color: #000;
        }
        input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 120px;
            font-family: 'NostalgicMyoeunHeullim', inherit;
            color: #000;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'NostalgicMyoeunHeullim', inherit;
            resize: vertical;
            min-height: 200px;
            box-sizing: border-box;
            background-color: #fffacd;
            color: #000;
            transition: border-color 0.3s;
        }
        textarea.exceeded {
            border-color: #ff6b6b;
            background-color: #ffe6e6;
        }
        .warning-message {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background-color: #ffe6e6;
            border: 1px solid #ff6b6b;
            border-radius: 4px;
            color: #ff6b6b;
            font-weight: bold;
        }
        .warning-message.show {
            display: block;
        }
        .stats {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f4f8;
            border-radius: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 12px;
            color: #000;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #000;
        }
        .stat-value.warning {
            color: #ff6b6b;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #ddd;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #51cf66;
            transition: background-color 0.3s;
            width: 0%;
        }
        .progress-fill.warning {
            background-color: #ffa94d;
        }
        .progress-fill.danger {
            background-color: #ff6b6b;
        }
        .button-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-family: 'NostalgicMyoeunHeullim', inherit;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn-copy {
            background-color: #51cf66;
            color: white;
        }
        .btn-copy:hover {
            background-color: #40c057;
        }
        .btn-clear {
            background-color: #ff6b6b;
            color: white;
        }
        .btn-clear:hover {
            background-color: #ff5252;
        }
        .copy-notification {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #51cf66;
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease-in-out;
        }
        .copy-notification.show {
            display: block;
        }
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="settings">
            <div class="setting-item">
                <label for="maxChars">최대 글자 수:</label>
                <input type="number" id="maxChars" value="1000" min="1">
            </div>
            <div class="setting-item">
                <input type="checkbox" id="excludeSpaces">
                <label for="excludeSpaces">공백 미포함 체크</label>
            </div>
        </div>

        <textarea id="textArea" placeholder="여기에 텍스트를 입력하세요..."></textarea>
        
        <div class="warning-message" id="warningMessage">
            ⚠️ 최대 글자 수를 초과했습니다. 더 이상 입력할 수 없습니다.
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">글자 수</div>
                <div class="stat-value" id="charCount">0</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-label">남은 글자 수</div>
                <div class="stat-value" id="remainingChars">1000</div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-copy" id="copyBtn">전체 복사</button>
            <button class="btn-clear" id="clearBtn">초기화</button>
        </div>
    </div>

    <div class="copy-notification" id="copyNotification">
        ✓ 복사되었습니다!
    </div>

    <script>
        const textArea = document.getElementById('textArea');
        const maxCharsInput = document.getElementById('maxChars');
        const excludeSpacesCheckbox = document.getElementById('excludeSpaces');
        const charCountDisplay = document.getElementById('charCount');
        const remainingCharsDisplay = document.getElementById('remainingChars');
        const progressBar = document.getElementById('progressBar');
        const warningMessage = document.getElementById('warningMessage');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyNotification = document.getElementById('copyNotification');

        // localStorage에서 저장된 데이터 불러오기
        function loadData() {
            const savedText = localStorage.getItem('wordCounterText');
            const savedMaxChars = localStorage.getItem('wordCounterMaxChars');
            const savedExcludeSpaces = localStorage.getItem('wordCounterExcludeSpaces');

            if (savedText) textArea.value = savedText;
            if (savedMaxChars) maxCharsInput.value = savedMaxChars;
            if (savedExcludeSpaces) excludeSpacesCheckbox.checked = JSON.parse(savedExcludeSpaces);

            updateCount();
        }

        // localStorage에 데이터 저장하기
        function saveData() {
            localStorage.setItem('wordCounterText', textArea.value);
            localStorage.setItem('wordCounterMaxChars', maxCharsInput.value);
            localStorage.setItem('wordCounterExcludeSpaces', JSON.stringify(excludeSpacesCheckbox.checked));
        }

        function updateCount() {
            const text = textArea.value;
            const maxChars = parseInt(maxCharsInput.value) || 1000;
            const excludeSpaces = excludeSpacesCheckbox.checked;
            
            const charCount = excludeSpaces ? text.replace(/\s/g, '').length : text.length;
            const remainingChars = maxChars - charCount;

            charCountDisplay.textContent = charCount;
            remainingCharsDisplay.textContent = Math.max(remainingChars, 0);

            const percent = Math.min((charCount / maxChars) * 100, 100);
            progressBar.style.width = percent + '%';

            if (charCount > maxChars) {
                charCountDisplay.classList.add('warning');
                progressBar.classList.add('danger');
                textArea.classList.add('exceeded');
                warningMessage.classList.add('show');
            } else {
                charCountDisplay.classList.remove('warning');
                textArea.classList.remove('exceeded');
                warningMessage.classList.remove('show');
                if (percent > 80) {
                    progressBar.classList.add('warning');
                } else {
                    progressBar.classList.remove('warning', 'danger');
                }
            }
        }

        // 텍스트 입력할 때마다 저장
        textArea.addEventListener('input', function(e) {
            const maxChars = parseInt(maxCharsInput.value) || 1000;
            const excludeSpaces = excludeSpacesCheckbox.checked;
            
            let text = this.value;
            const charCount = excludeSpaces ? text.replace(/\s/g, '').length : text.length;
            
            if (charCount > maxChars) {
                if (excludeSpaces) {
                    this.value = text.slice(0, -1);
                } else {
                    this.value = text.substring(0, maxChars);
                }
            }
            
            updateCount();
            saveData();
        });

        maxCharsInput.addEventListener('change', function() {
            updateCount();
            saveData();
        });

        excludeSpacesCheckbox.addEventListener('change', function() {
            updateCount();
            saveData();
        });

        // 전체 복사 버튼
        copyBtn.addEventListener('click', function() {
            if (textArea.value.length === 0) {
                alert('복사할 텍스트가 없습니다.');
                return;
            }

            navigator.clipboard.writeText(textArea.value).then(function() {
                copyNotification.classList.add('show');
                setTimeout(function() {
                    copyNotification.classList.remove('show');
                }, 2000);
            }).catch(function(err) {
                alert('복사에 실패했습니다.');
            });
        });

        // 초기화 버튼
        clearBtn.addEventListener('click', function() {
            if (confirm('정말 초기화하시겠습니까?')) {
                textArea.value = '';
                localStorage.removeItem('wordCounterText');
                updateCount();
            }
        });

        // 페이지 로드 시 저장된 데이터 불러오기
        loadData();
    </script>
</body>
</html>
